# Allow dependency postinstall/build scripts.
# Firebase App Hosting does not pin packageManager/engines.pnpm, so it installs
# the latest pnpm (currently 12.x). pnpm 11+ ignores package.json#pnpm and
# onlyBuiltDependencies; it honours allowBuilds here. onlyBuiltDependencies is
# kept in sync for local pnpm 10.
# Required — without these, pnpm fails with ERR_PNPM_IGNORED_BUILDS for
# packages that ship native binaries or codegen.
onlyBuiltDependencies:
  - '@firebase/util'
  - '@tailwindcss/oxide'
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver

allowBuilds:
  '@firebase/util': true
  '@tailwindcss/oxide': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
